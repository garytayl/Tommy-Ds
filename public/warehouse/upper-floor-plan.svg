<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
  <defs>
    <linearGradient id="floor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2520"/>
      <stop offset="100%" style="stop-color:#1a1714"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="640" fill="url(#floor)"/>
  <text x="500" y="38" text-anchor="middle" fill="#d4c4a8" font-family="system-ui,sans-serif" font-size="17" font-weight="600">
    Upper warehouse — floor plan
  </text>
  <text x="500" y="58" text-anchor="middle" fill="#8a7d68" font-family="system-ui,sans-serif" font-size="12">
    Column A: 10 rows · Columns B &amp; C: 8 rows each
  </text>
  <g id="grid">
    <text x="213" y="88" text-anchor="middle" fill="#a89878" font-family="system-ui,sans-serif" font-size="11" font-weight="600">A (10)</text>
    <text x="500" y="88" text-anchor="middle" fill="#a89878" font-family="system-ui,sans-serif" font-size="11" font-weight="600">B (8)</text>
    <text x="787" y="88" text-anchor="middle" fill="#a89878" font-family="system-ui,sans-serif" font-size="11" font-weight="600">C (8)</text>
    <rect x="72" y="96" width="856" height="488" fill="none" stroke="#6b5a45" stroke-width="2" rx="3"/>
    <line x1="357.33" y1="96" x2="357.33" y2="584" stroke="#8b7355" stroke-width="2" opacity="0.95"/>
    <line x1="642.67" y1="96" x2="642.67" y2="584" stroke="#8b7355" stroke-width="2" opacity="0.95"/>
    <!-- A: 10 rows — lines only in column A (9 internal) -->
    <g stroke="#5c5045" stroke-width="1" opacity="0.65">
      <line x1="72" y1="144.8" x2="357.33" y2="144.8"/>
      <line x1="72" y1="193.6" x2="357.33" y2="193.6"/>
      <line x1="72" y1="242.4" x2="357.33" y2="242.4"/>
      <line x1="72" y1="291.2" x2="357.33" y2="291.2"/>
      <line x1="72" y1="340" x2="357.33" y2="340"/>
      <line x1="72" y1="388.8" x2="357.33" y2="388.8"/>
      <line x1="72" y1="437.6" x2="357.33" y2="437.6"/>
      <line x1="72" y1="486.4" x2="357.33" y2="486.4"/>
      <line x1="72" y1="535.2" x2="357.33" y2="535.2"/>
    </g>
    <!-- B &amp; C: 8 rows — shared horizontal lines across both columns (7 internal) -->
    <g stroke="#5c5045" stroke-width="1" opacity="0.65">
      <line x1="357.33" y1="157" x2="928" y2="157"/>
      <line x1="357.33" y1="218" x2="928" y2="218"/>
      <line x1="357.33" y1="279" x2="928" y2="279"/>
      <line x1="357.33" y1="340" x2="928" y2="340"/>
      <line x1="357.33" y1="401" x2="928" y2="401"/>
      <line x1="357.33" y1="462" x2="928" y2="462"/>
      <line x1="357.33" y1="523" x2="928" y2="523"/>
    </g>
    <!-- Row numbers: A 1–10 -->
    <g fill="#6a5d4c" font-family="system-ui,sans-serif" font-size="9" text-anchor="end">
      <text x="66" y="123">1</text>
      <text x="66" y="172">2</text>
      <text x="66" y="221">3</text>
      <text x="66" y="270">4</text>
      <text x="66" y="319">5</text>
      <text x="66" y="368">6</text>
      <text x="66" y="417">7</text>
      <text x="66" y="466">8</text>
      <text x="66" y="515">9</text>
      <text x="66" y="564">10</text>
    </g>
    <!-- Row numbers: B &amp; C 1–8 (aligned to 8-row grid) -->
    <g fill="#6a5d4c" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">
      <text x="500" y="131">1</text>
      <text x="500" y="192">2</text>
      <text x="500" y="253">3</text>
      <text x="500" y="314">4</text>
      <text x="500" y="375">5</text>
      <text x="500" y="436">6</text>
      <text x="500" y="497">7</text>
      <text x="500" y="558">8</text>
    </g>
    <g fill="#6a5d4c" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">
      <text x="787" y="131">1</text>
      <text x="787" y="192">2</text>
      <text x="787" y="253">3</text>
      <text x="787" y="314">4</text>
      <text x="787" y="375">5</text>
      <text x="787" y="436">6</text>
      <text x="787" y="497">7</text>
      <text x="787" y="558">8</text>
    </g>
  </g>
  <text x="500" y="618" text-anchor="middle" fill="#7a6f5c" font-family="system-ui,sans-serif" font-size="12">
    Pan and zoom the map · A uses rows 1–10 · B and C use rows 1–8
  </text>
</svg>
