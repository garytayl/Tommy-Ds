<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640">
  <defs>
    <pattern id="invgrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#5c7a8b" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <linearGradient id="invbg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a2228"/>
      <stop offset="100%" style="stop-color:#152028"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="640" fill="url(#invbg)"/>
  <rect width="1000" height="640" fill="url(#invgrid)"/>
  <rect x="56" y="80" width="888" height="480" fill="none" stroke="#4a90a4" stroke-width="2" stroke-dasharray="12 8" rx="6" opacity="0.85"/>
  <text x="500" y="48" text-anchor="middle" fill="#a8c4d4" font-family="system-ui,sans-serif" font-size="20" font-weight="600">
    Upper warehouse  inventory map
  </text>
  <text x="500" y="320" text-anchor="middle" fill="#7a9aaa" font-family="system-ui,sans-serif" font-size="15">
    Use markers to label aisles, bays, or stock zones.
  </text>
  <text x="500" y="348" text-anchor="middle" fill="#5a7a8c" font-family="system-ui,sans-serif" font-size="13">
    Same window/door tools apply; rename labels to match your inventory scheme.
  </text>
</svg>
